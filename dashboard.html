<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echosoul - خزينة الإرث الزمنية</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #c5a880;
            --accent-hover: #b3966e;
            --border-color: #262a35;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 15px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 10px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
        }
        header span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            padding: 10px;
            background-color: #0f1115;
            border: 1px solid #374151;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            text-align: right;
        }
        .form-control:focus {
            border-color: var(--accent-color);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .vault-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .vault-item {
            background: #13151a;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
        }
        .vault-item h4 {
            color: var(--accent-color);
            font-size: 0.95rem;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .badge-time {
            background: rgba(197, 168, 128, 0.15);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .vault-item p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .nav-links {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
        }
        .nav-links a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Echosoul | الخزينة الزمنية</h1>
            <span>إدارة الوصايا والذكريات</span>
        </header>

        <!-- Form Card -->
        <div class="card">
            <h3>إضافة كبسولة زمنية أو وصية جديدة</h3>
            <div class="form-group">
                <label>عنوان الكبسولة (مثال: رسالتي لعائلتي في المستقبل)</label>
                <input type="text" id="vaultTitle" class="form-control" placeholder="اكتب العنوان هنا...">
            </div>
            <div class="form-group">
                <label>محتوى الوصية أو الرسالة</label>
                <textarea id="vaultContent" class="form-control" placeholder="اكتب التفاصيل، النصائح، أو الكلمات التي تريد تركها..."></textarea>
            </div>
            <div class="form-group">
                <label>تاريخ الإفراج المجدول (لا تفتح قبل هذا التاريخ)</label>
                <input type="date" id="vaultReleaseDate" class="form-control" value="2030-01-01">
            </div>
            <button class="btn" onclick="saveVaultItem()">قفل وإيداع في الخزينة الزمنية</button>
        </div>

        <!-- Vault Items Display -->
        <div class="card">
            <h3>الكبسولات المُدخرة في خزينتك</h3>
            <div class="vault-list" id="vaultList">
                <p style="color: var(--text-muted); font-size: 0.85rem;">لا توجد كبسولات زمنية مسجلة حتى الآن.</p>
            </div>
        </div>

        <div class="nav-links">
            <a href="index.html">الرئيسية</a> | 
            <a href="protocol.html">بروتوكول الأمان والأوصياء</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadVaultItems);

        function saveVaultItem() {
            const title = document.getElementById('vaultTitle').value.trim();
            const content = document.getElementById('vaultContent').value.trim();
            const releaseDate = document.getElementById('vaultReleaseDate').value;

            if (!title || !content || !releaseDate) {
                alert('الرجاء إكمال جميع الحقول وتحديد تاريخ الإفراج.');
                return;
            }

            const newItem = {
                title,
                content,
                releaseDate,
                createdDate: new Date().toLocaleDateString('ar-SA')
            };

            let vaultItems = JSON.parse(localStorage.getItem('echosoul_vault') || '[]');
            vaultItems.push(newItem);
            localStorage.setItem('echosoul_vault', JSON.stringify(vaultItems));

            // تفريغ الحقول
            document.getElementById('vaultTitle').value = '';
            document.getElementById('vaultContent').value = '';
            document.getElementById('vaultReleaseDate').value = '2030-01-01';

            loadVaultItems();
            alert('تم قفل الإيداع وإضافته للخزينة الزمنية بنجاح!');
        }

        function loadVaultItems() {
            const vaultList = document.getElementById('vaultList');
            let vaultItems = JSON.parse(localStorage.getItem('echosoul_vault') || '[]');

            if (vaultItems.length === 0) {
                vaultList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">لا توجد كبسولات زمنية مسجلة حتى الآن.</p>';
                return;
            }

            vaultList.innerHTML = '';
            vaultItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'vault-item';
                div.innerHTML = `
                    <h4>
                        <span>${index + 1}. ${item.title}</span>
                        <span class="badge-time">تاريخ الفتح: ${item.releaseDate}</span>
                    </h4>
                    <p><strong>المحتوى:</strong> ${item.content}</p>
                    <p style="font-size: 0.75rem; color: #6b7280; margin-top: 8px;">تاريخ الإنشاء: ${item.createdDate}</p>
                `;
                vaultList.appendChild(div);
            });
        }
    </script>

</body>
</html>
