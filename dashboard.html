<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echosoul - لوحة تحكم الإرث الرقمي</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #c5a880;
            --accent-hover: #b3966e;
            --border-color: #262a35;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 15px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 1.3rem;
            color: var(--accent-color);
        }
        header span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            padding: 10px;
            background-color: #0f1115;
            border: 1px solid #374151;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            text-align: right;
        }
        .form-control:focus {
            border-color: var(--accent-color);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .memory-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .memory-item {
            background: #13151a;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .memory-item h4 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .back-links {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
        }
        .back-links a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Echosoul | لوحة التحكم</h1>
            <span>خزينة الذاكرة المحلية</span>
        </header>

        <!-- Memory Injection Card -->
        <div class="card">
            <h3>أضف قصة حياة أو نصيحة لإرثك</h3>
            <div class="form-group">
                <label>عنوان الذكرى أو الموقف</label>
                <input type="text" id="memoryTitle" class="form-control" placeholder="مثال: درسي الأول في الصبر...">
            </div>
            <div class="form-group">
                <label>التفاصيل والحكمة المستفادة</label>
                <textarea id="memoryContent" class="form-control" placeholder="اكتب التفاصيل بروحك وأسلوبك..."></textarea>
            </div>
            <button class="btn" onclick="saveMemory()">حفظ في الإرث الرقمي</button>
        </div>

        <!-- Saved Memories View -->
        <div class="card">
            <h3>الذكريات المحفوظة محلياً</h3>
            <div class="memory-list" id="memoryList">
                <p style="color: var(--text-muted); font-size: 0.85rem;">لا توجد ذكريات محفوظة حتى الآن.</p>
            </div>
        </div>

        <div class="back-links">
            <a href="index.html">الرئيسية</a> | 
            <a href="chat.html">المحادثة</a> | 
            <a href="protocol.html">الأمان</a>
        </div>
    </div>

    <script>
        // تحميل الذكريات المحفوظة عند فتح الصفحة
        document.addEventListener('DOMContentLoaded', loadMemories);

        function saveMemory() {
            const title = document.getElementById('memoryTitle').value.trim();
            const content = document.getElementById('memoryContent').value.trim();

            if (!title || !content) {
                alert('الرجاء تعبئة العنوان التفاصيل أولاً.');
                return;
            }

            const newMemory = { title, content, date: new Date().toLocaleDateString('ar-SA') };
            
            let memories = JSON.parse(localStorage.getItem('echosoul_memories') || '[]');
            memories.push(newMemory);
            localStorage.setItem('echosoul_memories', JSON.stringify(memories));

            document.getElementById('memoryTitle').value = '';
            document.getElementById('memoryContent').value = '';

            loadMemories();
            alert('تم حفظ الذكرى بنجاح في ذاكرتك المحلية!');
        }

        function loadMemories() {
            const memoryList = document.getElementById('memoryList');
            let memories = JSON.parse(localStorage.getItem('echosoul_memories') || '[]');

            if (memories.length === 0) {
                memoryList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">لا توجد ذكريات محفوظة حتى الآن.</p>';
                return;
            }

            memoryList.innerHTML = '';
            memories.forEach((mem, index) => {
                const item = document.createElement('div');
                item.className = 'memory-item';
                item.innerHTML = `
                    <h4>${index + 1}. ${mem.title} <span style="font-size:0.75rem; color:var(--text-muted); float:left;">${mem.date}</span></h4>
                    <p style="color: var(--text-main);">${mem.content}</p>
                `;
                memoryList.appendChild(item);
            });
        }
    </script>

</body>
</html>
