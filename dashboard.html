<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echosoul - خزينة الإرث الزمنية والميديا</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #c5a880;
            --accent-hover: #b3966e;
            --border-color: #262a35;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 15px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 10px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 1.1rem;
            color: var(--accent-color);
        }
        header span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            padding: 10px;
            background-color: #0f1115;
            border: 1px solid #374151;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            text-align: right;
        }
        .form-control:focus {
            border-color: var(--accent-color);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }
        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3Cpolyline points='6 9 12 15 18 9'%3e%3C/polyline%3e%3C/svg%3e");
            background-repeat: no-repeat;
            background-position: left 10px center;
            background-size: 16px;
        }
        .file-upload-box {
            border: 2px dashed #374151;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            background: #13151a;
            cursor: pointer;
        }
        .file-upload-box input {
            display: none;
        }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .vault-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .vault-item {
            background: #13151a;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
        }
        .vault-item h4 {
            color: var(--accent-color);
            font-size: 0.95rem;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .badge {
            background: rgba(197, 168, 128, 0.15);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .vault-item p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .nav-links {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
        }
        .nav-links a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Echosoul | الخزينة والوسائط</h1>
            <span id="userLoggedDisplay">الإدارة المحلية</span>
        </header>

        <!-- Form Card -->
        <div class="card">
            <h3>إضافة كبسولة إرث جديدة (نص وميديا)</h3>
            
            <div class="form-group">
                <label>عنوان الإرث أو الرسالة</label>
                <input type="text" id="vaultTitle" class="form-control" placeholder="مثال: رسالة صوتية وفيديو للعائلة...">
            </div>

            <div class="form-group">
                <label>نوع القفل وشرط الإفراج</label>
                <select id="lockType" class="form-control" onchange="toggleDateInput()">
                    <option value="date">كبسولة زمنية (تفتح في تاريخ محدد)</option>
                    <option value="guardian">بروتوكول الأوصياء (بعد الوفاة وبموافقتهم)</option>
                    <option value="instant">بدون قيود زمنية (متاح فوراً)</option>
                </select>
            </div>

            <div class="form-group" id="dateGroup">
                <label>تاريخ الفتح المستقبلي المستهدف</label>
                <input type="date" id="vaultReleaseDate" class="form-control" value="2030-01-01">
            </div>

            <div class="form-group">
                <label>محتوى الوصية النصي</label>
                <textarea id="vaultContent" class="form-control" placeholder="اكتب الكلمات أو الوصية هنا..."></textarea>
            </div>

            <div class="form-group">
                <label>إرفاق ملف ميديا (صورة، صوت، أو فيديو)</label>
                <div class="file-upload-box" onclick="document.getElementById('mediaFile').click()">
                    <span id="fileNameDisplay" style="font-size: 0.85rem; color: var(--text-muted);">انقر لاختيار مقطع فيديو، صوت، أو صورة من هاتفك</span>
                    <input type="file" id="mediaFile" accept="image/*,video/*,audio/*" onchange="handleFileSelect(this)">
                </div>
            </div>

            <button class="btn" onclick="saveAdvancedVault()">قفل وتأمين في الخزينة</button>
        </div>

        <!-- Vault Items Display -->
        <div class="card">
            <h3>كبسولاتك الموثقة</h3>
            <div class="vault-list" id="vaultList">
                <p style="color: var(--text-muted); font-size: 0.85rem;">لا توجد كبسولات مسجلة حالياً.</p>
            </div>
        </div>

        <div class="nav-links">
            <a href="index.html">الرئيسية والاشتراكات</a> | 
            <a href="protocol.html">الأوصياء والأمان</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('echosoul_user');
            if (user) {
                document.getElementById('userLoggedDisplay').textContent = user;
            }
            loadVaultItems();
        });

        function toggleDateInput() {
            const lockType = document.getElementById('lockType').value;
            const dateGroup = document.getElementById('dateGroup');
            if (lockType === 'date') {
                dateGroup.style.display = 'block';
            } else {
                dateGroup.style.display = 'none';
            }
        }

        let selectedFileName = '';
        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                selectedFileName = input.files[0].name;
                document.getElementById('fileNameDisplay').textContent = `تم إرفاق الملف: ${selectedFileName}`;
            }
        }

        function saveAdvancedVault() {
            const title = document.getElementById('vaultTitle').value.trim();
            const content = document.getElementById('vaultContent').value.trim();
            const lockType = document.getElementById('lockType').value;
            const releaseDate = document.getElementById('vaultReleaseDate').value;

            if (!title || !content) {
                alert('الرجاء إدخال عنوان الإرث والمحتوى النصي على الأقل.');
                return;
            }

            let lockConditionText = '';
            if (lockType === 'date') lockConditionText = `تاريخ الفتح: ${releaseDate}`;
            else if (lockType === 'guardian') lockConditionText = `يفتح عبر بروتوكول الأوصياء`;
            else lockConditionText = `متاح فوراً`;

            const newItem = {
                title,
                content,
                lockCondition: lockConditionText,
                media: selectedFileName ? selectedFileName : 'لا يوجد ملف مرفق',
                createdDate: new Date().toLocaleDateString('ar-SA')
            };

            let vaultItems = JSON.parse(localStorage.getItem('echosoul_vault_pro') || '[]');
            vaultItems.push(newItem);
            localStorage.setItem('echosoul_vault_pro', JSON.stringify(vaultItems));

            // تصفية المدخلات
            document.getElementById('vaultTitle').value = '';
            document.getElementById('vaultContent').value = '';
            document.getElementById('fileNameDisplay').textContent = 'انقر لاختيار مقطع فيديو، صوت، أو صورة من هاتفك';
            selectedFileName = '';

            loadVaultItems();
            alert('تم تأمين الكبسولة وإضافتها للخزينة الرقمية بنجاح!');
        }

        function loadVaultItems() {
            const vaultList = document.getElementById('vaultList');
            let vaultItems = JSON.parse(localStorage.getItem('echosoul_vault_pro') || '[]');

            if (vaultItems.length === 0) {
                vaultList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">لا توجد كبسولات مسجلة حالياً.</p>';
                return;
            }

            vaultList.innerHTML = '';
            vaultItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'vault-item';
                div.innerHTML = `
                    <h4>
                        <span>${index + 1}. ${item.title}</span>
                        <span class="badge">${item.lockCondition}</span>
                    </h4>
                    <p><strong>المحتوى:</strong> ${item.content}</p>
                    <p style="font-size: 0.8rem; color: var(--accent-color); margin-top: 5px;">📎 المرفق: ${item.media}</p>
                    <p style="font-size: 0.75rem; color: #6b7280; margin-top: 5px;">تاريخ الإنشاء: ${item.createdDate}</p>
                `;
                vaultList.appendChild(div);
            });
        }
    </script>

</body>
</html>
