<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echosoul - جلسة المحادثة الذكية</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #c5a880;
            --accent-hover: #b3966e;
            --border-color: #262a35;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
        }
        .chat-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .chat-header {
            padding: 15px 20px;
            background: #13151a;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h2 {
            font-size: 1.1rem;
            color: var(--accent-color);
        }
        .chat-header a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .api-config {
            padding: 10px 15px;
            background: #1f232b;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        .api-config input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .message.user {
            background-color: var(--accent-color);
            color: #000;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }
        .message.assistant {
            background-color: #21252e;
            color: var(--text-main);
            align-self: flex-end;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }
        .chat-input-area {
            padding: 15px;
            background: #13151a;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: var(--accent-color);
        }
        .chat-input-area button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .chat-input-area button:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <h2>Echosoul | التوأم الذكي</h2>
            <a href="index.html">← الرئيسية</a>
        </div>

        <!-- API Key Input for Direct Mobile Testing -->
        <div class="api-config">
            <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح OpenAI API هنا (sk-...)">
        </div>

        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                أهلاً بك يا بني. أنا هنا لأشاركك الذكريات والحكمة. كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messagesContainer = document.getElementById('chatMessages');
            const apiKeyInput = document.getElementById('apiKeyInput');
            
            const text = inputField.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            
            if (!apiKey) {
                alert('تنبيه: الرجاء إدخال مفتاح OpenAI API في الحقل المخصص بأعلى الصفحة أولاً.');
                return;
            }

            // عرض رسالة المستخدم في الشاشة فوراً
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            messagesContainer.appendChild(userMsg);
            
            inputField.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // إضافة رسالة مؤقتة تدل على جاري الكتابة
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message assistant';
            loadingMsg.id = 'loadingMsg';
            loadingMsg.textContent = 'جاري استدعاء الذاكرة...';
            messagesContainer.appendChild(loadingMsg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: 'أنت Echosoul، ذكاء اصطناعي لحفظ الإرث الرقمي. تحدث بنبرة دافئة وحكيمة وودودة باللغة العربية.' },
                            { role: 'user', content: text }
                        ]
                    })
                });

                const data = await response.json();
                
                // إزالة رسالة التحميل
                document.getElementById('loadingMsg').remove();

                if (data.choices && data.choices.length > 0) {
                    const reply = data.choices[0].message.content;
                    
                    const assistantMsg = document.createElement('div');
                    assistantMsg.className = 'message assistant';
                    assistantMsg.textContent = reply;
                    messagesContainer.appendChild(assistantMsg);
                } else if (data.error) {
                    throw new Error(data.error.message || 'خطأ من مزود الخدمة');
                } else {
                    throw new Error('استجابة غير صالحة من السيرفر.');
                }

            } catch (error) {
                // إزالة رسالة التحميل إن وجدت
                const loader = document.getElementById('loadingMsg');
                if (loader) loader.remove();

                const assistantMsg = document.createElement('div');
                assistantMsg.className = 'message assistant';
                assistantMsg.textContent = 'عذرًا، تعذر إرسال الرسالة: ' + error.message;
                messagesContainer.appendChild(assistantMsg);
            }

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
