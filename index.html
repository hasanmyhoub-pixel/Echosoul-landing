        .waitlist-form {

            max-width: 500px;

        }

            color: var(--text-main);

            transition: border-color 0.3s ease;
        }

            border-color: var(--accent-color);
        }

            transition: background 0.3s ease;
        }
        .cta-btn:hover {
            background-color: var(--accent-hover);
        }

        }

            color: var(--accent-hover);
        }
